<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мемкоин-бот">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex">
<title>Мемкоин-бот 24/7</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mut:#8b949e;--g:#3fb950;--y:#d29922;--r:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:920px;margin:0 auto;padding:12px 12px 90px}
  h1{font-size:18px;margin:0}
  h2{font-size:15px;margin:18px 0 8px}
  a{color:var(--acc);text-decoration:none}
  input,select,button,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  button{cursor:pointer;background:#21262d}
  button.pri{background:#1f6feb;border-color:#1f6feb;font-weight:600}
  button.danger{background:#3d1214;border-color:#8e1519;color:#ffb3ae}
  button:disabled{opacity:.5}
  .up{color:var(--g)} .dn{color:var(--r)} .mut{color:var(--mut)}
  .top{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#555;margin-right:6px;vertical-align:middle}
  .dot.on{background:var(--g);box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pl 2s infinite}
  .dot.bad{background:var(--r)}
  @keyframes pl{70%{box-shadow:0 0 0 8px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .stat i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
  .stat b{font-size:17px}
  .big{width:100%;padding:13px;font-size:16px;font-weight:700;border-radius:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:640px){.grid2{grid-template-columns:repeat(4,1fr)}}
  label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
  label input,label select{width:100%}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  summary{cursor:pointer;font-weight:600}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 10px;padding-bottom:2px}
  .tabs button{white-space:nowrap;background:none;border-color:transparent;color:var(--mut)}
  .tabs button.on{background:#21262d;border-color:var(--line);color:var(--text)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .card .sym{font-weight:700;font-size:16px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#21262d;color:var(--mut);white-space:nowrap}
  .kv{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;margin-top:6px}
  .kv span:nth-child(odd){color:var(--mut)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .acts button{flex:1;min-width:110px;padding:8px}
  .msg{font-size:13px;color:var(--mut);line-height:1.5;word-break:break-word}
  .ctx{margin:5px 0 0;padding-left:16px;font-size:12.5px;color:#c9d1d9}
  .rsn{margin-top:6px;font-size:13.5px}
  .rsn small{display:block;color:var(--mut);font-size:12.5px}
  .ev{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .ev small{color:var(--mut);display:block;font-size:11.5px}
  .empty{padding:26px 10px;text-align:center;color:var(--mut)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2128;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;z-index:9;max-width:92vw;box-shadow:0 8px 24px #000a}
  .toast.err{border-color:#8e1519;color:#ffb3ae}
  #login{max-width:380px;margin:12vh auto 0;padding:0 16px;text-align:center}
  #login input{width:100%;text-align:center;font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 10px}
  svg.sp{display:block;width:100%;height:44px;margin-top:8px}
  sub{font-size:.7em}
  .warnbox{background:#2b2000;border:1px solid #6e4b00;color:#f0d58a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
</style>
</head>
<body>

<div id="login" hidden>
  <h1 style="font-size:22px">🤖 Мемкоин-бот 24/7</h1>
  <p class="mut">Введите код доступа</p>
  <input id="pinIn" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button class="pri big" id="pinGo">Войти</button>
  <p class="mut" id="loginErr" style="min-height:22px"></p>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>🤖 Мемкоин-бот 24/7</h1>
    <span class="row"><a id="toScan" href="scanner.html" style="font-size:14px">🔎 Сканер</a><button id="refresh" title="Обновить">↻</button></span>
  </div>

  <div class="box">
    <div id="health" style="font-size:14px;margin-bottom:8px"></div>
    <button class="big" id="toggle"></button>
    <div id="timer" class="msg" style="margin-top:8px"></div>
    <div id="auto" class="msg" style="margin-top:6px"></div>
    <div id="info" class="msg" style="margin-top:6px"></div>
    <div class="row" style="margin-top:8px"><button id="tickNow">▶ Проверить рынок сейчас</button></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button data-t="open">Открытые</button>
    <button data-t="closed">Закрытые</button>
    <button data-t="ledger">📒 Тетрадь</button>
    <button data-t="events">Сигналы</button>
    <button data-t="settings">⚙️ Настройки</button>
  </div>
  <div id="view"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const API="https://gqnzktvbkgilreoqaggr.supabase.co/functions/v1/bot";
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem("mb_"+k);return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem("mb_"+k,v)}catch{}},del(k){try{localStorage.removeItem("mb_"+k)}catch{}}};
const EMBED=new URLSearchParams(location.search).has("embed");
let pin=LS.get("pin",""),S=null,tab=LS.get("tab","open"),off=0,busy=false,formDirty=false;

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=v=>(v<0?"−$":"$")+Math.abs(+v||0).toFixed(2);
const sgn=v=>`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${usd(v)}</span>`;
const pct=v=>v==null||isNaN(v)?"—":`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${(+v).toFixed(1)}%</span>`;
function money(n){if(n==null||isNaN(n))return"—";const a=Math.abs(n);return a>=1e9?"$"+(n/1e9).toFixed(2)+"B":a>=1e6?"$"+(n/1e6).toFixed(2)+"M":a>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+(+n).toFixed(0)}
function price(p){p=+p;if(!p)return"—";if(p>=1)return"$"+p.toFixed(3);const m=p.toFixed(14).match(/^0\.(0*)(\d{1,4})/);if(!m)return"$"+p.toPrecision(4);return m[1].length>=4?`$0.0<sub>${m[1].length}</sub>${m[2]}`:"$"+p.toPrecision(4)}
function dur(ms){const m=ms/6e4;if(m<1)return"меньше минуты";if(m<60)return Math.round(m)+" мин";const h=m/60;return h<48?h.toFixed(1)+" ч":Math.round(h/24)+" дн"}
const dt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtT=ms=>{let t=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(t/60),s=t%60;return m+":"+String(s).padStart(2,"0")};
const now=()=>Date.now()+off;
function toast(t,err){const e=$("toast");e.textContent=t;e.className="toast"+(err?" err":"");e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,err?5000:2600)}

/* ---------- API ---------- */
async function call(action,extra){
  let r;
  try{r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-pin":pin},body:JSON.stringify({action,...(extra||{})})})}
  catch{throw new Error("Нет связи с сервером. Проверьте интернет.")}
  const d=await r.json().catch(()=>({error:"Сервер ответил с ошибкой ("+r.status+")"}));
  if(r.status===401){logout(d.error);throw new Error(d.error)}
  if(d.error)throw new Error(d.error);
  return d;
}
function logout(msg){pin="";LS.del("pin");S=null;$("app").hidden=true;$("login").hidden=false;$("loginErr").textContent=msg||"";}
async function load(action,extra,quiet){
  if(busy)return;busy=true;$("refresh").disabled=true;
  try{const d=await call(action||"state",extra);S=d;off=d.now-Date.now();$("login").hidden=true;$("app").hidden=false;render();if(d.note)toast(d.note);return d}
  catch(e){if(!quiet)toast(e.message,true);throw e}
  finally{busy=false;$("refresh").disabled=false}
}

/* ---------- reasons ---------- */
const RSN=[
  [/^авто: стоп в безубытке/,"🛡️","Стоп в безубытке","После цели стоп стоял на цене входа — цена вернулась, остаток продан"],
  [/^авто: стоп-лосс/,"🔻","Сработал стоп-лосс","Цена упала до заданного стоп-лосса"],
  [/^авто: цель x?([\d.]+)/,"💰","Достигнута цель x$1","Продана половина, чтобы зафиксировать прибыль"],
  [/^бот: вышло время удержания/,"⏱","Вышло время удержания","Бот держал монету максимальное время"],
  [/^бот: ликвидность упала вдвое/,"🚨","Ликвидность упала вдвое","Признак вывода денег из пула — бот вышел"],
  [/^бот: красный флаг — (.+)/,"🚨","Красный флаг: $1","Появился опасный признак — бот вышел"],
  [/^бот: создатель продал все монеты/,"🚨","Создатель продал все монеты","Бот вышел следом"],
  [/^бот: рагпулл/,"🚨","Рагпулл","Ликвидность выведена — бот вышел"],
  [/^вручную/,"✋","Продано вручную","Вы нажали «Продать»"],
  [/^бот \((.+?)\): (.+)/,"🤖","Покупка ботом","$1 · $2"]
];
function reason(e){
  const r=e.reason||"";
  if(e.side==="buy"&&!r)return{ic:"🎮",t:"Ваша покупка",d:""};
  for(const[re,ic,t,d]of RSN){const m=r.match(re);if(m)return{ic,t:t.replace("$1",m[1]||""),d:d.replace("$1",m[1]||"").replace("$2",m[2]||"")}}
  return{ic:"ℹ️",t:r||"—",d:""};
}
const stopTxt=o=>`${o.nostop||o.stop==null?'<span class="mut">без стопа</span>':o.stop===0?'<span class="dn">стоп: безубыток</span> '+price(o.entry):`<span class="dn">стоп −${o.stop}%</span> → ${price(o.entry*(1-o.stop/100))}`} · ${o.tp>1?`<span class="up">цель x${o.tp}</span> → ${price(o.entry*o.tp)}`:'<span class="mut">без цели</span>'}`;

/* ---------- render ---------- */
function spark(p){
  const h=p.spark||[];if(h.length<3)return"";
  const xs=h.map(x=>x[0]),ys=h.map(x=>x[1]),lv=[p.entry];
  if(!p.nostop&&p.stop!=null)lv.push(p.entry*(1-p.stop/100));
  const mn=Math.min(...ys,...lv),mx=Math.max(...ys,...lv),W=300,H=44,x0=xs[0],x1=xs[xs.length-1]||x0+1;
  const X=t=>((t-x0)/(x1-x0||1)*W).toFixed(1),Y=v=>(mx===mn?H/2:H-3-(v-mn)/(mx-mn)*(H-6)).toFixed(1);
  const up=ys[ys.length-1]>=p.entry;
  return`<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(p.entry)}" y2="${Y(p.entry)}" stroke="#58a6ff" stroke-dasharray="4 4" stroke-width="1"/>${lv[1]!=null?`<line x1="0" x2="${W}" y1="${Y(lv[1])}" y2="${Y(lv[1])}" stroke="#f85149" stroke-dasharray="4 4" stroke-width="1"/>`:""}<polyline points="${h.map(x=>X(x[0])+","+Y(x[1])).join(" ")}" fill="none" stroke="${up?"#3fb950":"#f85149"}" stroke-width="1.8"/></svg>`;
}
function render(){
  if(!S)return;
  const c=S.cfg,T=S.totals,open=S.open,openVal=open.reduce((s,p)=>s+p.amt*p.cur/p.entry,0),openCost=open.reduce((s,p)=>s+p.amt,0);
  const total=T.bal+openVal,res=total-S.demo_start;
  // header / health
  const tickAgo=S.info.tick?now()-S.info.tick:null,alive=tickAgo!=null&&tickAgo<4*6e4;
  $("health").innerHTML=`<span class="dot ${alive?(S.bot_on?"on":""):"bad"}"></span>${alive?(S.bot_on?"<b>Бот работает</b> на сервере — можно закрыть страницу":"<b>Бот выключен.</b> Открытые сделки всё равно отслеживаются"):tickAgo==null?"Сервер ещё не запускался — подождите минуту":"<b class='dn'>Сервер не отвечает уже "+dur(tickAgo)+"</b>"}`;
  $("toggle").textContent=S.bot_on?"⏸ Выключить бота":"▶️ Включить бота";
  $("toggle").className="big "+(S.bot_on?"":"pri");
  timer();
  const A=S.info.auto;
  $("auto").innerHTML=c.auto&&A?`🤖 <b>Автонастройка:</b> фильтры «${esc(A.step)}» — ликвидность от ${money(A.minLiq)}, объём от ${money(A.minVol)}, возраст ${A.ageMin}–${A.ageMax||"∞"} ч → прошли ${A.n} из ${A.pool}.${A.last?`<br>Последняя покупка: ${esc(A.last)}`:""}`:"";
  $("info").innerHTML=S.info.msg?`<b>Последняя проверка${S.info.t?" ("+dt(S.info.t)+")":""}:</b> ${esc(S.info.msg)}`:"";
  // stats
  const wr=T.sells?Math.round(T.wins/T.sells*100)+"%":"—";
  $("stats").innerHTML=`
    <div class="stat"><i>Свободно</i><b>${usd(T.bal)}</b></div>
    <div class="stat"><i>Всего на счёте</i><b>${usd(total)}</b></div>
    <div class="stat"><i>Результат с начала</i><b>${sgn(res)}</b> ${pct(res/S.demo_start*100)}</div>
    <div class="stat"><i>Открыто сделок</i><b>${open.length}</b> <span class="mut" style="font-size:12px">${open.length?sgn(openVal-openCost):""}</span></div>
    <div class="stat"><i>Продаж / прибыльных</i><b>${T.sells} / ${wr}</b></div>
    <div class="stat"><i>Итог закрытых</i><b>${sgn(T.pnl)}</b></div>
    <div class="stat"><i>Ср. прибыль / убыток</i><b style="font-size:14px"><span class="up">${usd(T.wins?T.winSum/T.wins:0)}</span> / <span class="dn">${usd(T.sells-T.wins?T.lossSum/(T.sells-T.wins):0)}</span></b></div>
    <div class="stat"><i>Комиссии и проскальзывание</i><b class="dn">${usd(T.fees+T.slip)}</b></div>`;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  if(tab==="settings"){if(!formDirty||!$("f_auto"))renderSettings();return}
  $("view").innerHTML=({open:vOpen,closed:vClosed,ledger:vLedger,events:vEvents}[tab]||vOpen)();
}
function timer(){
  if(!S)return;
  if(!S.bot_on){$("timer").textContent="";return}
  const next=S.lastScan+S.cfg.every*1000-now();
  $("timer").innerHTML=next>5000?`⏱ Следующая проверка рынка примерно через <b>${fmtT(next)}</b>`:"🔎 Проверка рынка идёт или начнётся в течение минуты…";
}
const tagOf=p=>`<span class="tag">${p.bot?"🤖 бот":"🎮 вручную"}${p.lvl?" · "+({g:"🟢",y:"🟡",r:"🔴"}[p.lvl]||""):""}</span>`;
function vOpen(){
  const buyForm=`<details><summary>➕ Купить монету вручную (демо)</summary>
    <div class="grid2" style="margin-top:10px">
      <label style="grid-column:1/-1">Адрес токена (mint)<input id="b_addr" placeholder="адрес токена Solana" autocomplete="off" spellcheck="false"></label>
      <label>Сумма, $<input id="b_amt" type="number" inputmode="decimal" value="50"></label>
      <label>Стоп-лосс, % (0 — без стопа)<input id="b_stop" type="number" inputmode="decimal" value="30"></label>
      <label>Цель, x (0 — без цели)<input id="b_tp" type="number" inputmode="decimal" value="2" step="0.5"></label>
    </div><button class="pri" style="margin-top:10px;width:100%" data-act="buy">Купить в демо</button></details>`;
  if(!S.open.length)return`<div class="empty">Открытых сделок нет.${S.bot_on?" Бот ищет монеты — покупки появятся здесь.":" Включите бота или купите монету вручную."}</div>`+buyForm;
  return S.open.map(p=>{const v=p.amt*p.cur/p.entry,pl=v-p.amt,pc=(p.cur/p.entry-1)*100;
    return`<div class="card" data-id="${esc(p.id)}">
      <div class="hd"><span><span class="sym">${esc(p.sym)}</span> <span class="mut" style="font-size:12.5px">${esc(p.name)}</span></span>${tagOf(p)}</div>
      <div style="font-size:18px;font-weight:700;margin-top:4px">${sgn(pl)} ${pct(pc)}</div>
      ${spark(p)}
      <div class="kv">
        <span>Вложено → сейчас</span><span>${usd(p.amt)} → ${usd(v)}</span>
        <span>Вход → цена</span><span>${price(p.entry)} → ${price(p.cur)}</span>
        <span>Стоп / цель</span><span>${stopTxt(p)}</span>
        <span>Открыта</span><span>${dur(now()-p.openedAt)} назад${p.upd?` · цена ${dur(now()-p.upd)} назад`:""}</span>
        ${p.devNow!=null?`<span>Создатель держит</span><span>${(+p.devNow).toFixed(1)}%</span>`:""}
      </div>
      <div class="acts"><button data-act="s50">Продать 50%</button><button data-act="s100">Продать всё</button><button data-act="edit">Стоп / цель</button></div>
      <div class="row" style="margin-top:8px;font-size:13px"><a href="https://dexscreener.com/solana/${esc(p.addr)}" target="_blank" rel="noopener noreferrer">График DexScreener</a><a href="https://rugcheck.xyz/tokens/${esc(p.addr)}" target="_blank" rel="noopener noreferrer">RugCheck</a><a href="scanner.html#t=${esc(p.addr)}"${EMBED?' target="_top"':""}>Открыть в сканере</a></div>
    </div>`}).join("")+buyForm;
}
function vClosed(){
  if(!S.closed.length)return`<div class="empty">Закрытых сделок пока нет.</div>`;
  return S.closed.map(p=>{const pl=p.amt*(p.exit/p.entry-1),R=reason({side:"sell",reason:p.reason});
    return`<div class="card"><div class="hd"><span class="sym">${esc(p.sym)}</span>${tagOf(p)}</div>
      <div style="font-size:17px;font-weight:700;margin-top:3px">${sgn(pl)} ${pct((p.exit/p.entry-1)*100)}</div>
      <div class="rsn">${R.ic} <b>${esc(R.t)}</b></div>
      <div class="kv"><span>Вложено</span><span>${usd(p.amt)}</span><span>Вход → выход</span><span>${price(p.entry)} → ${price(p.exit)}</span><span>Держал</span><span>${dur(p.closedAt-p.openedAt)}</span><span>Закрыта</span><span>${dt(p.closedAt)}</span></div></div>`}).join("")
    +(S.closed.length>=200?`<div class="mut" style="text-align:center;font-size:12.5px">Показаны последние 200</div>`:"");
}
function vLedger(){
  if(!S.ledger.length)return`<div class="empty">Записей пока нет. Они появятся после первой покупки.</div>`;
  const G=new Map();for(const e of S.ledger)if(e.side==="sell"){const R=reason(e),k=R.t.replace(/ x[\d.]+$/,"").replace(/^Красный флаг:.*/,"Красный флаг");const g=G.get(k)||{ic:R.ic,n:0,pl:0};g.n++;g.pl+=+e.pnl||0;G.set(k,g)}
  const sum=G.size?`<div class="box" style="font-size:13.5px"><b class="mut">Причины продаж:</b><br>${[...G].sort((a,b)=>b[1].n-a[1].n).map(([k,g])=>`${g.ic} ${esc(k)}: ${g.n} шт., ${sgn(g.pl)}`).join("<br>")}</div>`:"";
  return sum+S.ledger.map(e=>{const R=reason(e),buy=e.side==="buy";
    return`<div class="card"><div class="hd"><span>${buy?'<span class="up">🟢 Покупка</span>':'<span class="dn">🔴 Продажа</span>'} <span class="sym">${esc(e.sym)}</span></span><span class="mut" style="font-size:12.5px">${dt(e.t)}</span></div>
      ${buy?"":`<div style="font-size:16px;font-weight:700;margin-top:3px">${sgn(e.pnl)} ${e.cost?pct(e.pnl/e.cost*100):""}</div>`}
      <div class="kv">
        <span>Сумма</span><span>${usd(e.amt)}</span>
        <span>Цена рынка → ваша</span><span>${price(e.mkt)} → ${price(e.px)}</span>
        <span>Комиссия / проскальзывание</span><span class="dn">${usd(e.fee)} / ${usd(e.slip)}</span>
        <span>Стоп / цель</span><span>${stopTxt(e)}</span>
      </div>
      <div class="rsn">${R.ic} <b>${esc(R.t)}</b>${R.d?`<small>${esc(R.d)}</small>`:""}</div>
      ${e.ctx?.length?`<div class="mut" style="font-size:11.5px;margin-top:6px;text-transform:uppercase">Рынок перед продажей</div><ul class="ctx">${e.ctx.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div>`}).join("")+(S.ledger.length>=300?`<div class="mut" style="text-align:center;font-size:12.5px">Показаны последние 300 записей</div>`:"");
}
function vEvents(){
  if(!S.events.length)return`<div class="empty">Сигналов пока не было.</div>`;
  return`<div class="box">${S.events.map(e=>`<div class="ev"><small>${dt(e.t)}</small>${esc(e.msg)}</div>`).join("")}</div>`;
}
const RISKTXT={g:"Только 🟢. Создатель ≤5%, топ-10 ≤30%, без инсайдеров, нужен X или Telegram.",y:"🟢 и 🟡 (🟡 — половиной суммы). Создатель ≤10%, топ-10 ≤40%, нужен X или Telegram.",r:"🟢 🟡 🔴 (🔴 — 30% суммы). Создатель ≤20%, топ-10 ≤60%, соцсети не нужны, покупает и без ответа RugCheck.",x:"Почти всё. Создатель ≤50%, топ-10 ≤90%. Большинство сделок может быть в минус."};
function renderSettings(){
  const c=S.cfg,F=(k,l,extra)=>`<label>${l}<input id="f_${k}" type="number" inputmode="decimal" value="${c[k]}" ${extra||""}></label>`;
  $("view").innerHTML=`
  <div class="box">
    <h2 style="margin-top:0">Бот</h2>
    <div class="grid2">
      <label>Параметры покупки<select id="f_auto"><option value="1">🤖 Автоматически</option><option value="0">✋ Вручную</option></select></label>
      <label>Уровень риска<select id="f_lvl"><option value="g">🛡️ Осторожный</option><option value="y">⚖️ Обычный</option><option value="r">🔥 Рискованный</option><option value="x">💀 Очень рискованный</option></select></label>
      ${F("every","Проверять рынок каждые, сек (от 60)")}
      ${F("gap","Пауза между покупками, мин")}
    </div>
    <div class="msg" id="riskTxt" style="margin-top:8px"></div>
    <div id="manual">
      <h2>Ручные параметры <span class="mut" style="font-weight:400;font-size:12.5px">(0 в любом поле — без ограничения)</span></h2>
      <div class="grid2">
        <label>Сумму считать<select id="f_amtMode"><option value="pct">в % от баланса</option><option value="usd">в долларах</option></select></label>
        ${F("pct","Сумма сделки, %")}${F("usd","Сумма сделки, $")}${F("maxPos","Макс. позиций")}
        ${F("stop","Стоп-лосс, %")}${F("tp","Цель, x",'step="0.5"')}${F("hold","Держать макс., ч")}
        ${F("minLiq","Мин. ликвидность, $")}${F("minVol","Мин. объём 24ч, $")}${F("ageMin","Возраст от, ч")}${F("ageMax","Возраст до, ч")}
        <label>Динамика<select id="f_mom"><option value="up">🔥 или 📈</option><option value="hot">только 🔥</option><option value="any">любая, кроме ❄️</option></select></label>
      </div>
    </div>
    <div class="msg" id="autoTxt" style="margin-top:8px"></div>
    <button class="pri big" style="margin-top:12px" data-act="save">Сохранить настройки</button>
  </div>
  <div class="box">
    <h2 style="margin-top:0">Демо-счёт</h2>
    <div class="row"><label style="flex:1">Стартовый баланс, $<input id="f_start" type="number" inputmode="decimal" value="${S.demo_start}"></label><button class="danger" data-act="reset" style="align-self:end">Начать заново</button></div>
    <div class="msg" style="margin-top:6px">«Начать заново» удалит все демо-сделки, тетрадь и сигналы.</div>
  </div>
  <div class="box">
    <h2 style="margin-top:0">Доступ</h2>
    <div class="row"><label style="flex:1">Новый код доступа (от 6 символов)<input id="f_pin" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><button data-act="setpin" style="align-self:end">Сменить код</button></div>
    <div class="row" style="margin-top:10px"><button data-act="logout">Выйти на этом устройстве</button>${EMBED?"":'<a href="scanner.html" style="margin-left:auto">Открыть полный сканер →</a>'}</div>
    <div class="msg" style="margin-top:8px">💡 Чтобы открывать как приложение: в меню браузера выберите «На экран “Домой”» / «Добавить на главный экран».</div>
  </div>`;
  $("f_auto").value=c.auto?"1":"0";$("f_lvl").value=c.lvl;$("f_amtMode").value=c.amtMode;$("f_mom").value=c.mom;
  const sync=()=>{const a=$("f_auto").value==="1";$("manual").style.opacity=a?.4:1;$("manual").querySelectorAll("input,select").forEach(e=>e.disabled=a);
    $("riskTxt").innerHTML="<b>"+$("f_lvl").selectedOptions[0].textContent+":</b> "+RISKTXT[$("f_lvl").value]+" На любом уровне бот не покупает honeypot, рагпулл и токены, которые создатель может заморозить.";
    $("autoTxt").innerHTML=a?"🤖 <b>Автоматически:</b> бот сам подбирает фильтры под рынок (от строгих к мягким, пока не найдёт 8 кандидатов), стоп по волатильности монеты (15–45%), цель в 3 раза дальше стопа, сумму — чтобы при стопе терять 1,5–3% счёта. До 6 позиций, держит до 24 ч.":"✋ <b>Вручную:</b> бот работает по полям выше.";};
  $("f_auto").onchange=sync;$("f_lvl").onchange=sync;sync();formDirty=false;
  $("view").querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>formDirty=true));
}
function readCfg(){const c={auto:$("f_auto").value==="1",lvl:$("f_lvl").value,amtMode:$("f_amtMode").value,mom:$("f_mom").value};
  for(const k of["every","gap","pct","usd","maxPos","stop","tp","hold","minLiq","minVol","ageMin","ageMax"])c[k]=+String($("f_"+k).value).replace(",",".");return c}

/* ---------- actions ---------- */
async function act(a,el){
  const card=el.closest("[data-id]"),id=card?.dataset.id,p=id&&S.open.find(x=>x.id===id);
  try{
    if(a==="s50"||a==="s100"){if(!confirm(`Продать ${a==="s50"?"половину":"всю позицию"} ${p.sym} по текущей цене?`))return;el.disabled=true;await load("sell",{id,frac:a==="s50"?0.5:1});toast("Продано");}
    else if(a==="edit"){const st=prompt(`Стоп-лосс для ${p.sym}, % от входа (0 — без стопа):`,p.nostop||p.stop==null?"0":String(p.stop));if(st==null)return;const tp=prompt(`Цель для ${p.sym}, во сколько раз (например 2; 0 — без цели):`,String(p.tp||0));if(tp==null)return;
      await load("edit",{id,stop:+String(st).replace(",","."),tp:+String(tp).replace(",",".")});toast("Сохранено");}
    else if(a==="buy"){el.disabled=true;await load("buy",{addr:$("b_addr").value.trim(),amt:+$("b_amt").value,stop:+$("b_stop").value,tp:+$("b_tp").value});toast("Куплено в демо");}
    else if(a==="save"){el.disabled=true;await load("save",{cfg:readCfg()});formDirty=false;renderSettings();toast("Настройки сохранены");}
    else if(a==="reset"){if(!confirm("Начать демо заново? Все сделки, тетрадь и сигналы будут удалены."))return;await load("reset",{start:+$("f_start").value||1000});formDirty=false;renderSettings();toast("Демо-счёт начат заново");}
    else if(a==="setpin"){const np=$("f_pin").value.trim().toUpperCase();if(np.length<6){toast("Код должен быть от 6 символов",true);return}if(!confirm("Сменить код доступа на «"+np+"»? Запомните его — старый перестанет работать."))return;
      await call("setpin",{newPin:np});pin=np;LS.set("pin",pin);$("f_pin").value="";toast("Код доступа изменён");}
    else if(a==="logout"){logout("")}
  }catch(e){toast(e.message,true)}finally{if(el&&el.isConnected)el.disabled=false}
}
$("view").addEventListener("click",e=>{const b=e.target.closest("button[data-act]");if(b)act(b.dataset.act,b)});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;LS.set("tab",tab);formDirty=false;render()});
$("refresh").onclick=()=>load().catch(()=>{});
$("toggle").onclick=async()=>{const on=!S.bot_on;if(!on&&!confirm("Выключить бота? Новых покупок не будет, открытые сделки продолжат отслеживаться (стоп и цель работают)."))return;
  try{await load("save",{bot_on:on});toast(on?"Бот включён — первая проверка в течение минуты":"Бот выключен")}catch{}};
$("tickNow").onclick=async()=>{const b=$("tickNow");b.disabled=true;b.textContent="🔎 Проверяю рынок… до минуты";
  try{await load("tick");toast("Проверка завершена")}catch{}finally{b.disabled=false;b.textContent="▶ Проверить рынок сейчас"}};
async function login(){pin=$("pinIn").value.trim().toUpperCase();if(!pin)return;$("loginErr").textContent="Проверяю…";
  try{await load("state",null,true);LS.set("pin",pin);$("loginErr").textContent=""}catch(e){$("loginErr").textContent=e.message}}
$("pinGo").onclick=login;$("pinIn").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

if(EMBED)$("toScan").hidden=true;
setInterval(timer,1000);
setInterval(()=>{if(pin&&S&&!document.hidden&&!(tab==="settings"&&formDirty))load(null,null,true).catch(()=>{})},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pin&&S)load(null,null,true).catch(()=>{})});
if(pin)load("state",null,true).catch(()=>{if(pin){$("login").hidden=false;$("loginErr").textContent="Не удалось связаться с сервером — попробуйте ещё раз"}});else $("login").hidden=false;
</script>
</body>
</html>
