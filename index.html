<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Торговый бот">
<meta name="theme-color" content="#0d1117">
<meta name="robots" content="noindex">
<title>Торговый бот 24/7</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#e6edf3;--mut:#8b949e;--g:#3fb950;--y:#d29922;--r:#f85149;--acc:#58a6ff}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  .wrap{max-width:760px;margin:0 auto;padding:12px 12px 90px}
  h1{font-size:18px;margin:0}
  h2{font-size:15px;margin:18px 0 8px}
  a{color:var(--acc);text-decoration:none}
  input,select,button,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
  button{cursor:pointer;background:#21262d}
  button.pri{background:#1f6feb;border-color:#1f6feb;font-weight:600}
  button.danger{background:#3d1214;border-color:#8e1519;color:#ffb3ae}
  button:disabled{opacity:.5}
  .up{color:var(--g)} .dn{color:var(--r)} .mut{color:var(--mut)}
  .top{display:flex;align-items:center;gap:10px;justify-content:space-between;position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0;margin-bottom:4px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
  .alertbox{background:#3d1214;border:1px solid #8e1519;color:#ffb3ae;border-radius:10px;padding:9px 12px;margin-bottom:10px;font-size:14px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  @media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
  .stat i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
  .stat b{font-size:17px}
  .big{width:100%;padding:13px;font-size:16px;font-weight:700;border-radius:10px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media(min-width:640px){.grid2{grid-template-columns:repeat(4,1fr)}}
  label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
  label input,label select{width:100%}
  details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  summary{cursor:pointer;font-weight:600}
  summary .sm{display:block;font-weight:400;font-size:12.5px;color:var(--mut);margin:2px 0 0 18px}
  details.plain{background:none;border:0;padding:0;margin:8px 0 0}
  details.plain summary{font-weight:400;font-size:13px;color:var(--acc)}
  .tabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;padding-bottom:2px}
  .tabs button{white-space:nowrap;background:none;border-color:transparent;color:var(--mut)}
  .tabs button.on{background:#21262d;border-color:var(--line);color:var(--text)}
  .tabs .ic{margin-right:4px}
  /* счёт */
  .total{font-size:32px;font-weight:800;line-height:1.15;margin:2px 0 4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .two>div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  .two i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
  .two b{font-size:16px}
  /* боты и выключатели */
  .bot{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .bot b{font-size:15px}
  .sw{display:block;position:relative;flex:none;width:52px;height:30px;margin-top:2px}
  .sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer;z-index:1}
  .sw span{position:absolute;inset:0;background:#3a414a;border-radius:30px;transition:background .15s}
  .sw span::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#e6edf3;transition:left .15s}
  .sw input:checked+span{background:#238636}
  .sw input:checked+span::after{left:25px}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .sec{display:flex;align-items:baseline;gap:7px;margin:16px 2px 6px;font-size:15px}
  .hint{font-size:12px;color:var(--mut);margin:0 2px 7px}
  /* сделки: строка, которая раскрывается */
  details.tr{padding:0;margin-bottom:8px;overflow:hidden}
  details.tr>summary{position:relative;list-style:none;font-weight:400;padding:10px 30px 10px 12px}
  details.tr>summary::-webkit-details-marker{display:none}
  details.tr>summary::after{content:"›";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:20px;transition:transform .15s}
  details.tr[open]>summary::after{transform:translateY(-50%) rotate(90deg)}
  details.tr[open]>summary{border-bottom:1px solid var(--line)}
  details.tr>.in{padding:4px 12px 12px}
  .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .l1>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .l1 .pl{font-weight:700;white-space:nowrap}
  .l2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);margin-top:2px}
  .l2>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .l2>span:last-child{white-space:nowrap}
  .sym{font-weight:700;font-size:16px}
  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
  .seg button{flex:1;background:none;border:0;color:var(--mut);padding:8px;border-radius:8px;font-size:15px}
  .seg button.on{background:#21262d;color:var(--text);font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 8px}
  .chips button{padding:6px 12px;border-radius:20px;font-size:13.5px;background:none;color:var(--mut)}
  .chips button.on{background:#21262d;color:var(--text);border-color:var(--acc)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
  .card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#21262d;color:var(--mut);white-space:nowrap}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin-top:6px}
  .kv span:nth-child(odd){color:var(--mut)}
  .kv span:nth-child(even){text-align:right}
  .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .acts button{flex:1;min-width:110px;padding:8px}
  .msg{font-size:13px;color:var(--mut);line-height:1.5;word-break:break-word}
  .ctx{margin:5px 0 0;padding-left:16px;font-size:12.5px;color:#c9d1d9}
  .rsn{margin-top:6px;font-size:13.5px}
  .rsn small{display:block;color:var(--mut);font-size:12.5px}
  .ev{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .ev small{color:var(--mut);display:block;font-size:11.5px}
  .gl p{margin:0 0 7px;font-size:13.5px;line-height:1.45}
  .empty{padding:22px 10px;text-align:center;color:var(--mut)}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1c2128;border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:14px;z-index:9;max-width:92vw;box-shadow:0 8px 24px #000a}
  .toast.err{border-color:#8e1519;color:#ffb3ae}
  .warnbox{background:#2b2000;border:1px solid #6e4b00;color:#f0d58a;border-radius:8px;padding:8px 10px;font-size:13px;margin-top:8px}
  #login{max-width:380px;margin:12vh auto 0;padding:0 16px;text-align:center}
  #login input{width:100%;text-align:center;font-size:20px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 10px}
  svg.sp{display:block;width:100%;height:44px;margin-top:8px}
  sub{font-size:.7em}
  @media(max-width:640px){
    .wrap{padding:6px 10px calc(86px + env(safe-area-inset-bottom))}
    h1{font-size:17px}
    .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:rgba(22,27,34,.96);border-top:1px solid var(--line);z-index:8;gap:2px;overflow:visible;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
    .tabs button{flex:1;min-width:0;padding:5px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:8px;white-space:nowrap}
    .tabs .ic{font-size:20px;margin:0}
    .toast{bottom:calc(78px + env(safe-area-inset-bottom))}
    .stat b{font-size:16px}
    .acts button{min-width:0;padding:11px 6px;font-size:15px}
    .kv{font-size:13px}
    .grid2{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<div id="login" hidden>
  <h1 style="font-size:22px">🤖 Торговый бот 24/7</h1>
  <p class="mut">Введите код доступа</p>
  <input id="pinIn" placeholder="XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button class="pri big" id="pinGo">Войти</button>
  <p class="mut" id="loginErr" style="min-height:22px"></p>
</div>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>🤖 Торговый бот</h1>
    <button id="refresh" title="Обновить">↻</button>
  </div>
  <div id="alert" class="alertbox" hidden></div>
  <div class="tabs" id="tabs">
    <button data-t="home"><span class="ic">🏠</span>Главная</button>
    <button data-go="scanner.html" id="toScan"><span class="ic">🔎</span>Сканер</button>
    <button data-t="history"><span class="ic">📜</span>История</button>
    <button data-t="events"><span class="ic">🔔</span>События</button>
    <button data-t="settings"><span class="ic">⚙️</span>Настройки</button>
  </div>
  <div id="view"></div>
</div>

<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const API="https://gqnzktvbkgilreoqaggr.supabase.co/functions/v1/bot";
const FAPI=API.replace(/bot$/,"fut");
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem("mb_"+k);return v==null?d:v}catch{return d}},set(k,v){try{localStorage.setItem("mb_"+k,v)}catch{}},del(k){try{localStorage.removeItem("mb_"+k)}catch{}}};
const EMBED=new URLSearchParams(location.search).has("embed");
let pin=LS.get("pin",""),S=null,FS=null,off=0,busy=false,formDirty=false;
let tab=LS.get("tab","home");tab=({open:"home",closed:"history",ledger:"history"})[tab]||tab;if(!["home","history","events","settings"].includes(tab))tab="home";
let hv=LS.get("hv","trades")==="ledger"?"ledger":"trades",hf=["all","m","f"].includes(LS.get("hf","all"))?LS.get("hf","all"):"all";
// переход из меню сканера: index.html#history и т.п.
function fromHash(){const h=location.hash.slice(1);if(!["home","history","events","settings"].includes(h))return false;tab=h;LS.set("tab",tab);history.replaceState(null,"",location.pathname+location.search);return true}
fromHash();window.addEventListener("hashchange",()=>{if(fromHash()){formDirty=false;render(true);scrollTo(0,0)}});
const OPEN=new Set(),op=k=>OPEN.has(k)?" open":""; // какие карточки и разделы раскрыты

/* ---------- helpers ---------- */
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=v=>(v<0?"−$":"$")+Math.abs(+v||0).toFixed(2);
const sgn=v=>`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${usd(v)}</span>`;
const pct=v=>v==null||isNaN(v)?"—":`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${(+v).toFixed(1)}%</span>`;
const plain=v=>(v>0?"+":v<0?"−":"")+Math.abs(+v).toFixed(1)+"%";
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c};
function money(n){if(n==null||isNaN(n))return"—";const a=Math.abs(n);return a>=1e9?"$"+(n/1e9).toFixed(2)+"B":a>=1e6?"$"+(n/1e6).toFixed(2)+"M":a>=1e3?"$"+(n/1e3).toFixed(1)+"K":"$"+(+n).toFixed(0)}
function price(p){p=+p;if(!p)return"—";if(p>=1)return"$"+p.toFixed(3);const m=p.toFixed(14).match(/^0\.(0*)(\d{1,4})/);if(!m)return"$"+p.toPrecision(4);return m[1].length>=4?`$0.0<sub>${m[1].length}</sub>${m[2]}`:"$"+p.toPrecision(4)}
function dur(ms){const m=ms/6e4;if(m<1)return"меньше минуты";if(m<60)return Math.round(m)+" мин";const h=m/60;return h<48?h.toFixed(1)+" ч":Math.round(h/24)+" дн"}
const dt=t=>new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtT=ms=>{let t=Math.max(0,Math.ceil(ms/1000));const m=Math.floor(t/60),s=t%60;return m+":"+String(s).padStart(2,"0")};
const now=()=>Date.now()+off;
function toast(t,err){const e=$("toast");e.textContent=t;e.className="toast"+(err?" err":"");e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,err?5000:2600)}

/* ---------- API ---------- */
async function call(action,extra,url){
  let r;
  try{r=await fetch(url||API,{method:"POST",headers:{"content-type":"application/json","x-pin":pin},body:JSON.stringify({action,...(extra||{})})})}
  catch{throw new Error("Нет связи с сервером. Проверьте интернет.")}
  const d=await r.json().catch(()=>({error:"Сервер ответил с ошибкой ("+r.status+")"}));
  if(r.status===401){logout(d.error);throw new Error(d.error)}
  if(d.error)throw new Error(d.error);
  return d;
}
function logout(msg){pin="";LS.del("pin");S=null;FS=null;$("app").hidden=true;$("login").hidden=false;$("loginErr").textContent=msg||"";}
async function load(action,extra,quiet){
  if(busy){if(!action)return;while(busy)await new Promise(r=>setTimeout(r,120))} // действие ждёт, фоновое обновление пропускается
  busy=true;$("refresh").disabled=true;
  try{const[d,fs]=await Promise.all([call(action||"state",extra),call("state",null,FAPI).catch(()=>null)]);S=d;if(fs)FS=fs;off=d.now-Date.now();$("login").hidden=true;$("app").hidden=false;render();if(d.note)toast(d.note);return d}
  catch(e){if(!quiet)toast(e.message,true);throw e}
  finally{busy=false;$("refresh").disabled=false}
}
async function fload(action,extra){FS=await call(action,extra,FAPI);if(FS.note)toast(FS.note);await load(null,null,true).catch(()=>{})}

/* ---------- причины сделок ---------- */
const RSN=[
  [/^плечо: цель/,"💰","Плечо: достигнута цель","Цена дошла до цели — сделка закрыта с прибылью"],
  [/^плечо: трейлинг-стоп/,"📈","Плечо: трейлинг-стоп","Цена отошла от лучшего значения — прибыль зафиксирована"],
  [/^плечо: стоп в безубытке/,"🛡️","Плечо: стоп в безубытке","Цена вернулась к входу — сделка закрыта около нуля"],
  [/^плечо: стоп-лосс/,"🔻","Плечо: стоп-лосс","Цена пошла против сделки и дошла до стоп-лосса"],
  [/^плечо: ликвидация/,"💥","Плечо: ликвидация","Цена дошла до ликвидации — маржа сделки потеряна целиком"],
  [/^плечо: вышло время удержания/,"⏱","Плечо: вышло время удержания","Сделка держалась максимальное время"],
  [/^бот: тренд (.+)/,"🤖","Сигнал бота","тренд $1"],
  [/^авто: трейлинг-стоп/,"📈","Трейлинг-стоп","Цена отошла от максимума — бот продал и зафиксировал прибыль"],
  [/^авто: стоп в безубытке/,"🛡️","Стоп в безубытке","После цели стоп стоял на цене входа — цена вернулась, остаток продан"],
  [/^авто: стоп-лосс/,"🔻","Сработал стоп-лосс","Цена упала до заданного стоп-лосса"],
  [/^авто: цель x?([\d.]+)/,"💰","Достигнута цель x$1","Продана половина, чтобы зафиксировать прибыль"],
  [/^бот: вышло время удержания/,"⏱","Вышло время удержания","Бот держал монету максимальное время"],
  [/^бот: ликвидность упала вдвое/,"🚨","Ликвидность упала вдвое","Признак вывода денег из пула — бот вышел"],
  [/^бот: красный флаг — (.+)/,"🚨","Красный флаг: $1","Появился опасный признак — бот вышел"],
  [/^бот: создатель продал все монеты/,"🚨","Создатель продал все монеты","Бот вышел следом"],
  [/^бот: рагпулл/,"🚨","Рагпулл","Ликвидность выведена — бот вышел"],
  [/^вручную/,"✋","Продано вручную","Вы нажали «Продать»"],
  [/^бот \((.+?)\): (.+)/,"🤖","Покупка ботом","$1 · $2"]
];
function reason(e){
  const r=e.reason||"";
  if(e.side==="buy"&&!r)return{ic:"🎮",t:"Ваша покупка",d:""};
  for(const[re,ic,t,d]of RSN){const m=r.match(re);if(m)return{ic,t:t.replace("$1",m[1]||""),d:d.replace("$1",m[1]||"").replace("$2",m[2]||"")}}
  return{ic:"ℹ️",t:r||"—",d:""};
}
function freason(e){
  if(e.side==="buy"&&!e.reason)return{ic:"🎮",t:"Вы открыли сделку",d:""};
  if(e.reason==="вручную")return{ic:"✋",t:"Закрыто вручную",d:"Вы нажали «Закрыть сделку»"};
  return reason(e);
}
const stopTxt=o=>`${o.nostop||o.stop==null?'<span class="mut">без стопа</span>':o.tsl>0?`<span class="up">стоп подтянут</span> → ${price(o.tsl)} (${pct((o.tsl/o.entry-1)*100)})`:o.stop===0?'<span class="dn">стоп: безубыток</span> '+price(o.entry):`<span class="dn">стоп −${o.stop}%</span> → ${price(o.entry*(1-o.stop/100))}`} · ${o.tp>1?`<span class="up">цель x${o.tp}</span> → ${price(o.entry*o.tp)}`:'<span class="mut">без цели</span>'}`;

/* ---------- мемкоины: карточки ---------- */
function sparkSvg(h,entry,stop,up){
  if(h.length<3)return"";
  const ys=h.map(x=>x[1]),lv=stop!=null?[entry,stop]:[entry],mn=Math.min(...ys,...lv),mx=Math.max(...ys,...lv),W=300,H=44,x0=h[0][0],x1=h[h.length-1][0]||x0+1;
  const X=t=>((t-x0)/(x1-x0||1)*W).toFixed(1),Y=v=>(mx===mn?H/2:H-3-(v-mn)/(mx-mn)*(H-6)).toFixed(1);
  return`<svg class="sp" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${Y(entry)}" y2="${Y(entry)}" stroke="#58a6ff" stroke-dasharray="4 4" stroke-width="1"/>${stop!=null?`<line x1="0" x2="${W}" y1="${Y(stop)}" y2="${Y(stop)}" stroke="#f85149" stroke-dasharray="4 4" stroke-width="1"/>`:""}<polyline points="${h.map(x=>X(x[0])+","+Y(x[1])).join(" ")}" fill="none" stroke="${up?"#3fb950":"#f85149"}" stroke-width="1.8"/></svg>`;
}
const beAt=p=>{if(!S||(p.stop===0&&!p.nostop)||p.beDone)return 0;const t=S.cfg.auto?(p.stop0||p.stop||30):S.cfg.be;return t>0?t:0};
const mtag=p=>`<span class="tag">🪙 ${p.bot?"бот":"вручную"}${p.lvl?" "+({g:"🟢",y:"🟡",r:"🔴"}[p.lvl]||""):""}</span>`;
const mstop=p=>p.nostop||p.stop==null?"без стопа":p.tsl>0?`<span class="up">стоп в плюсе ${plain((p.tsl/p.entry-1)*100)}</span>`:p.stop===0?"🛡️ стоп в безубытке":`стоп −${p.stop}%`;

  if(!S.ledger.length)return`<div class="empty">Записей пока нет. Они появятся после первой покупки.</div>`;
  const G=new Map();for(const e of S.ledger)if(e.side==="sell"){const R=e.kind==="fut"?freason(e):reason(e),k=R.t.replace(/ x[\d.]+$/,"").replace(/^Красный флаг:.*/,"Красный флаг");const g=G.get(k)||{ic:R.ic,n:0,pl:0};g.n++;g.pl+=+e.pnl||0;G.set(k,g)}
  const sum=G.size?`<div class="box" style="font-size:13.5px"><b class="mut">Причины продаж:</b><br>${[...G].sort((a,b)=>b[1].n-a[1].n).map(([k,g])=>`${g.ic} ${esc(k)}: ${g.n} шт., ${sgn(g.pl)}`).join("<br>")}</div>`:"";
  return sum+S.ledger.map(e=>{if(e.kind==="fut")return fled(e);const R=reason(e),buy=e.side==="buy";
    return`<div class="card"><div class="hd"><span>${buy?'<span class="up">🟢 Покупка</span>':'<span class="dn">🔴 Продажа</span>'} <span class="sym">${esc(e.sym)}</span></span><span class="mut" style="font-size:12.5px">${dt(e.t)}</span></div>
      ${buy?"":`<div style="font-size:16px;font-weight:700;margin-top:3px">${sgn(e.pnl)} ${e.cost?pct(e.pnl/e.cost*100):""}</div>`}
      <div class="kv">
        <span>Сумма</span><span>${usd(e.amt)}</span>
        <span>Цена рынка → ваша</span><span>${price(e.mkt)} → ${price(e.px)}</span>
        <span>Комиссия / проскальзывание</span><span class="dn">${usd(e.fee)} / ${usd(e.slip)}</span>
        <span>Стоп / цель</span><span>${stopTxt(e)}</span>
      </div>
      <div class="rsn">${R.ic} <b>${esc(R.t)}</b>${R.d?`<small>${esc(R.d)}</small>`:""}</div>
      ${e.ctx?.length?`<div class="mut" style="font-size:11.5px;margin-top:6px;text-transform:uppercase">Рынок перед продажей</div><ul class="ctx">${e.ctx.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
    </div>`}).join("")+(S.ledger.length>=300?`<div class="mut" style="text-align:center;font-size:12.5px">Показаны последние 300 записей</div>`:"");
}
function vEvents(){
  if(!S.events.length)return`<div class="empty">Событий пока не было.</div>`;
  return`<div class="hint">Что делали боты: покупки, продажи, переносы стопа.</div><div class="box">${S.events.map(e=>`<div class="ev"><small>${dt(e.t)}</small>${esc(e.msg)}</div>`).join("")}</div>`;
}
const RISKTXT={g:"Только 🟢. Не покупает перегретые монеты (больше ±25% за час или ±125% за сутки); в авторежиме — только ликвидность от $100K и возраст от 6 ч. Создатель ≤5%, топ-10 ≤30%, без инсайдеров, нужен X или Telegram.",y:"🟢 и 🟡 (🟡 — половиной суммы). Не покупает перегретые монеты (больше ±30% за час или ±150% за сутки); в авторежиме — только ликвидность от $50K и возраст от 2 ч. Создатель ≤10%, топ-10 ≤40%, нужен X или Telegram.",r:"🟢 🟡 🔴 (🔴 — 30% суммы). Создатель ≤20%, топ-10 ≤60%, соцсети не нужны, покупает и без ответа RugCheck.",x:"Почти всё. Создатель ≤50%, топ-10 ≤90%. Большинство сделок может быть в минус."};
const LVN={g:"🛡️ Осторожный",y:"⚖️ Обычный",r:"🔥 Рискованный",x:"💀 Очень рискованный"};

    <div class="grid2" style="margin-top:10px">

        ${F("minLiq","Мин. ликвидность, $")}${F("minVol","Мин. объём 24ч, $")}${F("ageMin","Возраст от, ч")}${F("ageMax","Возраст до, ч")}
        <label>Динамика<select id="f_mom"><option value="up">🔥 или 📈</option><option value="hot">только 🔥</option><option value="any">любая, кроме ❄️</option></select></label>

    </div>
    <div class="msg" id="autoTxt" style="margin-top:8px"></div>
    <button class="pri big" style="margin-top:12px" data-act="save">Сохранить настройки</button>
  </details>
  ${FS?(()=>{const g=FS.cfg,G=(k,l,x)=>`<label>${l}<input id="g_${k}" type="number" inputmode="decimal" value="${g[k]}" ${x||""}></label>`;return`<details data-k="s2"${op("s2")}><summary>⚡ Крипта с плечом<span class="sm">${g.on?"включён":"выключен"} · плечо до x${g.lev} · до ${g.maxPos} ${plural(g.maxPos,"сделки","сделок","сделок")} · ${({both:"лонг и шорт",long:"только лонг",short:"только шорт"})[g.dirs]}</span></summary>
    <div class="grid2" style="margin-top:10px">
      <label>Бот<select id="g_on"><option value="1">▶️ Включён</option><option value="0">⏸ Выключен</option></select></label>
      <label>Направление<select id="g_dirs"><option value="both">Лонг и шорт</option><option value="long">Только лонг</option><option value="short">Только шорт</option></select></label>
      ${G("lev","Плечо, до x (1–20)")}${G("risk","Риск на сделку, % счёта",'step="0.5"')}${G("maxPos","Макс. сделок")}${G("tp","Цель, во сколько раз дальше стопа",'step="0.5"')}${G("hold","Держать макс., ч")}
    </div>
    <div class="msg" style="margin-top:8px">Бот торгует ${FS.syms.map(x=>esc(x.s)).join(", ")} на том же демо-счёте — в лонг (на рост) и в шорт (на падение). Вход: тренд на часовом графике и пробой максимума или минимума за 5 часов с повышенным объёмом. Стоп — по волатильности монеты (0,8–5% цены), цель — во столько раз дальше стопа, сколько указано выше. Когда прибыль сравняется со стопом, стоп переходит в безубыток и дальше идёт за ценой. Маржа на сделку — не больше 10% счёта. Учитываются комиссия 0,05% за вход и выход, проскальзывание и плата за удержание.</div>
    <div class="warnbox">Плечо умножает и прибыль, и убыток. Если цена дойдёт до ликвидации, маржа сделки теряется целиком.</div>
    <button class="pri big" style="margin-top:12px" data-act="fsave">Сохранить настройки крипты</button>
  </details>`})():""}
  <details data-k="s3"${op("s3")}><summary>💰 Демо-счёт<span class="sm">стартовый баланс ${usd(S.demo_start)}</span></summary>
    <div class="row" style="margin-top:10px"><label style="flex:1">Стартовый баланс, $<input id="f_start" type="number" inputmode="decimal" value="${S.demo_start}"></label><button class="danger" data-act="reset" style="align-self:end">Начать заново</button></div>
    <div class="msg" style="margin-top:6px">«Начать заново» удалит все демо-сделки, тетрадь и события.</div>
  </details>
  <details data-k="s4"${op("s4")}><summary>🔑 Доступ и приложение<span class="sm">код доступа, выход, значок на экране</span></summary>
    <div class="row" style="margin-top:10px"><label style="flex:1">Новый код доступа (от 6 символов)<input id="f_pin" autocomplete="off" autocapitalize="characters" spellcheck="false"></label><button data-act="setpin" style="align-self:end">Сменить код</button></div>
    <div class="row" style="margin-top:10px"><button data-act="logout">Выйти на этом устройстве</button>${EMBED?"":'<a href="scanner.html" style="margin-left:auto">Открыть сканер →</a>'}</div>
    <div class="msg" style="margin-top:8px">💡 Чтобы открывать как приложение: в меню браузера выберите «На экран “Домой”» / «Добавить на главный экран».</div>
  </details>
  <details data-k="s5"${op("s5")}><summary>❓ Что значат слова<span class="sm">стоп, цель, безубыток, плечо, маржа, ликвидация</span></summary>
    <div class="gl" style="margin-top:10px">
      <p><b>Демо-счёт</b> — виртуальные деньги. Сделки считаются по настоящим ценам, но реальных денег нет.</p>
      <p><b>Стоп-лосс</b> — цена, при которой бот продаёт, чтобы убыток не рос дальше.</p>
      <p><b>Цель</b> — цена, при которой бот фиксирует прибыль. У мемкоинов на цели продаётся половина, остаток держится дальше.</p>
      <p><b>Безубыток</b> — стоп переносится на цену входа: сделка уже не уйдёт в большой минус.</p>
      <p><b>Подтянутый стоп (трейлинг)</b> — стоп идёт за ценой и сохраняет часть набранной прибыли.</p>
      <p><b>🟢 🟡 🔴</b> — оценка риска мемкоина: низкий, средний, высокий.</p>
      <p><b>Ликвидность</b> — сколько денег в пуле монеты. Чем её меньше, тем легче обрушить цену.</p>
      <p><b>Лонг / шорт</b> — ставка на рост / на падение цены.</p>
      <p><b>Плечо</b> — позиция больше ваших денег в несколько раз. Во столько же раз растут и прибыль, и убыток.</p>
      <p><b>Маржа</b> — ваши деньги в сделке с плечом (залог).</p>
      <p><b>Ликвидация</b> — цена, при которой маржа сделки теряется целиком.</p>
      <p><b>Комиссия и проскальзывание</b> — расходы на каждую покупку и продажу; они уже учтены в результате.</p>
    </div>
  </details>`;
  if(FS){$("g_on").value=FS.cfg.on?"1":"0";$("g_dirs").value=FS.cfg.dirs}
  $("f_auto").value=c.auto?"1":"0";$("f_lvl").value=c.lvl;$("f_amtMode").value=c.amtMode;$("f_mom").value=c.mom;
  const sync=()=>{const a=$("f_auto").value==="1";$("manual").style.opacity=a?.4:1;$("manual").querySelectorAll("input,select").forEach(e=>e.disabled=a);
    $("riskTxt").innerHTML="<b>"+$("f_lvl").selectedOptions[0].textContent+":</b> "+RISKTXT[$("f_lvl").value]+" На любом уровне бот не покупает honeypot, рагпулл и токены, которые создатель может заморозить.";
    $("autoTxt").innerHTML=a?"🤖 <b>Автоматически:</b> бот сам подбирает фильтры под рынок (от строгих к мягким, пока не найдёт 5 кандидатов, но не ниже границ уровня риска), стоп по волатильности монеты (15–45%), цель в 3 раза дальше стопа, сумму — чтобы при стопе терять 1,5–3% счёта (не больше 10% счёта на сделку). <b>Стоп переносится в безубыток</b>, когда прибыль сравняется с размером стопа (например, стоп −20% → безубыток при +20%), а дальше <b>подтягивается за ценой</b>: держится на 15–25% ниже максимума и фиксирует прибыль. Цены открытых сделок бот проверяет каждые ~15 секунд. До 6 позиций, держит до 24 ч.":"✋ <b>Вручную:</b> бот работает по полям выше. «Стоп в безубыток при росте» — на сколько процентов должна вырасти цена, чтобы стоп переехал на цену входа (0 — выключено). «Трейлинг-стоп» — после безубытка стоп держится на столько процентов ниже максимума цены и фиксирует прибыль (0 — выключено).";};
  $("f_auto").onchange=sync;$("f_lvl").onchange=sync;sync();formDirty=false;
  $("view").querySelectorAll("input,select").forEach(e=>e.addEventListener("input",()=>formDirty=true));
}
function readCfg(){const c={auto:$("f_auto").value==="1",lvl:$("f_lvl").value,amtMode:$("f_amtMode").value,mom:$("f_mom").value};
  for(const k of["every","gap","pct","usd","maxPos","stop","be","trail","tp","hold","minLiq","minVol","ageMin","ageMax"])c[k]=+String($("f_"+k).value).replace(",",".");return c}

/* ---------- действия ---------- */
async function act(a,el){
  const card=el.closest("[data-id]"),id=card?.dataset.id,p=id&&S.open.find(x=>x.id===id);
  const fid=el.closest("[data-fid]")?.dataset.fid,fp=fid&&FS?.open.find(x=>x.id===fid);
  try{
    if(a==="s50"||a==="s100"){if(!confirm(`Продать ${a==="s50"?"половину":"всю позицию"} ${p.sym} по текущей цене?`))return;el.disabled=true;await load("sell",{id,frac:a==="s50"?0.5:1});toast("Продано");}
    else if(a==="edit"){const be=p.stop===0&&!p.nostop;const st=prompt(be?`Стоп ${p.sym} сейчас в безубытке и подтягивается за ценой. Оставьте поле пустым, чтобы его не менять, или введите новый стоп, % от входа (0 — без стопа):`:`Стоп-лосс для ${p.sym}, % от входа (0 — без стопа):`,be?"":p.nostop||p.stop==null?"0":String(p.stop));if(st==null)return;const tp=prompt(`Цель для ${p.sym}, во сколько раз (например 2; 0 — без цели):`,String(p.tp||0));if(tp==null)return;
      const x={id,tp:+String(tp).replace(",",".")};if(String(st).trim()!=="")x.stop=+String(st).replace(",",".");await load("edit",x);toast("Сохранено");}
    else if(a==="be"){if(!confirm(`Перенести стоп ${p.sym} на цену входа (${p.cur>=p.entry?"сейчас цена выше входа":"сейчас цена НИЖЕ входа — позиция продастся при следующей проверке"})?`))return;el.disabled=true;await load("edit",{id,be:true});toast("Стоп перенесён в безубыток");}
    else if(a==="buy"){el.disabled=true;await load("buy",{addr:$("b_addr").value.trim(),amt:+$("b_amt").value,stop:+$("b_stop").value,tp:+$("b_tp").value});OPEN.delete("fb");toast("Куплено в демо");}
    else if(a==="fclose"){if(!confirm(`Закрыть ${fp.sym} ${fdir(fp)} x${fp.lev} по текущей цене?`))return;el.disabled=true;await fload("close",{id:fid});toast("Сделка закрыта");}
    else if(a==="fopen"){el.disabled=true;await fload("open",{sym:$("o_sym").value,dir:$("o_dir").value,margin:N("o_margin"),lev:N("o_lev"),stop:N("o_stop"),tp:N("o_tp")});OPEN.delete("fo");toast("Сделка открыта в демо");}
    else if(a==="tick"){el.disabled=true;el.textContent="🔎 Проверяю рынок… до минуты";const ft=call("tick",null,FAPI).then(x=>{FS=x}).catch(()=>{});await load("tick");await ft;toast("Проверка завершена");}
    else if(a==="fsave"){el.disabled=true;await fload("save",{cfg:{on:$("g_on").value==="1",dirs:$("g_dirs").value,lev:N("g_lev"),risk:N("g_risk"),maxPos:N("g_maxPos"),tp:N("g_tp"),hold:N("g_hold")}});formDirty=false;renderSettings();toast("Настройки крипты сохранены");}
    else if(a==="save"){el.disabled=true;await load("save",{cfg:readCfg()});formDirty=false;renderSettings();toast("Настройки сохранены");}
    else if(a==="reset"){if(!confirm("Начать демо заново? Все сделки, тетрадь и события будут удалены."))return;await load("reset",{start:+$("f_start").value||1000});formDirty=false;renderSettings();toast("Демо-счёт начат заново");}
    else if(a==="setpin"){const np=$("f_pin").value.trim().toUpperCase();if(np.length<6){toast("Код должен быть от 6 символов",true);return}if(!confirm("Сменить код доступа на «"+np+"»? Запомните его — старый перестанет работать."))return;
      await call("setpin",{newPin:np});pin=np;LS.set("pin",pin);$("f_pin").value="";toast("Код доступа изменён");}
    else if(a==="logout"){logout("")}
    if(S&&tab!=="settings")render(true);
  }catch(e){toast(e.message,true)}finally{if(el&&el.isConnected)el.disabled=false}
}
async function toggleBot(which,on,el){
  el.blur();
  if(!on&&!confirm(`Выключить бота «${which==="meme"?"Мемкоины":"Крипта с плечом"}»? Новых сделок не будет, открытые продолжат отслеживаться (стоп и цель работают).`)){el.checked=true;return}
  try{if(which==="meme")await load("save",{bot_on:on},true);else await fload("save",{cfg:{on}});render(true);toast(on?"Бот включён — первая проверка в течение минуты":"Бот выключен")}
  catch(e){toast(e.message,true);render(true)}
}
const view=$("view");
view.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.act)act(b.dataset.act,b);
  else if(b.dataset.hv){hv=b.dataset.hv;LS.set("hv",hv);render(true)}
  else if(b.dataset.hf){hf=b.dataset.hf;LS.set("hf",hf);render(true)}
});
view.addEventListener("change",e=>{const s=e.target.closest("input[data-sw]");if(s)toggleBot(s.dataset.sw,s.checked,s)});
view.addEventListener("toggle",e=>{const k=e.target.dataset?.k;if(k){if(e.target.open)OPEN.add(k);else OPEN.delete(k)}},true);
$("tabs").addEventListener("click",e=>{const g=e.target.closest("button[data-go]");if(g){location.href=g.dataset.go;return}const b=e.target.closest("button[data-t]");if(!b)return;tab=b.dataset.t;LS.set("tab",tab);formDirty=false;render(true);scrollTo(0,0)});
$("refresh").onclick=()=>load().catch(()=>{});
async function login(){pin=$("pinIn").value.trim().toUpperCase();if(!pin)return;$("loginErr").textContent="Проверяю…";
  try{await load("state",null,true);LS.set("pin",pin);$("loginErr").textContent=""}catch(e){$("loginErr").textContent=e.message}}
$("pinGo").onclick=login;$("pinIn").addEventListener("keydown",e=>{if(e.key==="Enter")login()});

if(EMBED)$("toScan").hidden=true;
setInterval(timer,1000);
setInterval(()=>{if(pin&&S&&!document.hidden&&!(tab==="settings"&&formDirty))load(null,null,true).catch(()=>{})},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&pin&&S)load(null,null,true).catch(()=>{})});
if(pin)load("state",null,true).catch(()=>{if(pin){$("login").hidden=false;$("loginErr").textContent="Не удалось связаться с сервером — попробуйте ещё раз"}});else $("login").hidden=false;
</script>
